name: nightly

# In season (March-October) at 11:00 UTC (6 a.m. Central during daylight time):
# re-check the last 5 days of MLB and AAA games and ingest weather 7 days back.
# The job fails (red) if any day could not be fetched completely.
on:
  schedule:
    - cron: "0 11 * 3-10 *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.PV_DATA_TOKEN }}
      PV_DATA_REPO: ${{ secrets.PV_DATA_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript tests/testthat.R
      - name: Ingest yesterday
        run: Rscript scripts/ingest_daily.R
      - name: Upload new files
        run: |
          Rscript scripts/sync_store.R upload raw/statcast/MLB/$(date -u +%Y)
          Rscript scripts/sync_store.R upload raw/statcast/AAA/$(date -u +%Y)
          Rscript scripts/sync_store.R upload raw/weather/daily/MLB
          Rscript scripts/sync_store.R upload raw/weather/daily/AAA
