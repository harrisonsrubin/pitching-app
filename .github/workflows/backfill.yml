name: backfill

on:
  workflow_dispatch:
    inputs:
      level:
        description: "MLB or AAA"
        required: true
        default: "MLB"
      start:
        description: "First season"
        required: true
      end:
        description: "Last season"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.PV_DATA_TOKEN }}
      PV_DATA_REPO: ${{ secrets.PV_DATA_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"   # must match renv.lock
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript tests/testthat.R
      - name: Backfill, compact, and upload one season at a time
        run: |
          for s in $(seq ${{ inputs.start }} ${{ inputs.end }}); do
            Rscript scripts/sync_store.R download raw/statcast/${{ inputs.level }}/$s || true
            Rscript scripts/backfill_statcast.R ${{ inputs.level }} $s $s
            Rscript scripts/sync_store.R upload raw/statcast/${{ inputs.level }}/$s
            Rscript scripts/sync_store.R upload-file raw/statcast/${{ inputs.level }}/$s.parquet
          done
