name: nightly

# In season (March-October) at 11:00 UTC (6 a.m. Central during daylight time):
# re-check the last 5 days of MLB and AAA games and ingest weather 7 days back.
# The job fails (red) if any day could not be fetched completely.
on:
  schedule:
    - cron: "0 11 * 3-10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.PV_DATA_TOKEN }}
      PV_DATA_REPO: ${{ secrets.PV_DATA_REPO }}
      PV_APP_REPO: ${{ github.repository }}
      APP_GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript tests/testthat.R
      - name: Ingest yesterday
        run: Rscript scripts/ingest_daily.R
      - name: Upload new files
        run: |
          Rscript scripts/sync_store.R upload raw/statcast/MLB/$(date -u +%Y)
          Rscript scripts/sync_store.R upload raw/statcast/AAA/$(date -u +%Y)
          Rscript scripts/sync_store.R upload raw/weather/daily/MLB
          Rscript scripts/sync_store.R upload raw/weather/daily/AAA
      - name: Refresh Stats API data (schedule, season stats)
        run: |
          Rscript scripts/backfill_statsapi.R current
          Rscript scripts/sync_store.R upload raw/statsapi
      - name: Rebuild and publish the current season
        run: |
          SEASON=$(Rscript -e 'source("R/load.R"); cat(last_season())')
          for LV in MLB AAA; do
            Rscript scripts/fetch_inputs.R $LV $SEASON
            Rscript scripts/update_season.R $LV $SEASON
            # A tag saved during the rebuild: rebuild again with it, so this run never
            # publishes older corrections over a newer rescore.
            for TRY in 1 2; do
              git fetch -q origin main
              if git diff --quiet HEAD origin/main -- corrections/; then break; fi
              git checkout -q origin/main -- corrections/ && git reset -q --soft origin/main
              Rscript scripts/update_season.R $LV $SEASON
            done
            Rscript scripts/publish.R season $LV $SEASON
          done
